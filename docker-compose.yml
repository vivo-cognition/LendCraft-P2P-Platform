version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: lendcraft_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: lendcraft_blockchain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
